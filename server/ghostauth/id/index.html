<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <meta name="description" content="Аккаунты GhostID: вход, переключение и управление аккаунтами GhostEcos на этом устройстве.">
  <title>Аккаунты · GhostID</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth/id/id.css?v=20261116-3">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/home" aria-label="GhostEcos">
      <img class="brand-mark" src="/favicon.png" alt="" width="24" height="24">
      <span>GhostEcos</span>
    </a>
    <span class="top-label">GhostID</span>
  </header>

  <main class="content">
    <section class="empty" data-empty hidden>
      <p class="empty-title">Пока ни одного аккаунта</p>
      <p class="empty-copy">Войди или создай аккаунт GhostID — он появится здесь и в приложениях экосистемы.</p>
      <a class="btn primary" href="/v2/auth?return=%2Fid">Войти в GhostID</a>
    </section>

    <section class="profile-card" data-active hidden>
      <div class="banner" data-banner>
        <img class="banner-image" data-banner-image alt="" decoding="async" hidden>
        <audio data-music-audio preload="none" hidden></audio>
      </div>
      <div class="avatar" data-avatar aria-hidden="true">G</div>

      <div class="identity">
        <div class="name-row">
          <h1 class="name" data-name>—</h1>
          <span class="verified" data-verified hidden title="Подтверждённый аккаунт" aria-label="Подтверждённый аккаунт">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 14.6 5l3.6-.3.8 3.5 3 2-1.6 3.2 1 3.5-3.3 1.6-1.9 3-3.4-.9-3.4.9-1.9-3L4.2 17l1-3.5L3.6 10l3-2 .8-3.5L11 4.8 12 2.5Z" fill="currentColor"/><path d="M8.6 12.2 11 14.6l4.5-4.9" fill="none" stroke="#111113" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <button class="icon-action" type="button" data-edit-active title="Изменить профиль" aria-label="Изменить профиль">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Zm11.5-14.5 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="handle" data-handle></p>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-val" data-stat-following>0</div><div class="stat-lbl">Подписки</div></div>
        <div class="stat"><div class="stat-val" data-stat-followers>0</div><div class="stat-lbl">Подписчики</div></div>
        <div class="stat"><div class="stat-val" data-stat-likes>0</div><div class="stat-lbl">Лайки</div></div>
      </div>

      <p class="bio" data-about hidden></p>
      <p class="joined" data-joined hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M3.5 10h17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span data-joined-text></span>
      </p>

      <div class="music" data-music hidden role="group" aria-label="Музыка профиля">
        <button class="music-info" type="button" data-music-open aria-haspopup="dialog" aria-label="Открыть список музыки профиля">
          <span class="music-cover" data-music-cover hidden aria-hidden="true"></span>
          <span class="music-copy">
            <strong data-music-title></strong>
            <small data-music-artist hidden></small>
          </span>
        </button>
        <span class="music-time" data-music-time>0:00</span>
        <button class="music-play" type="button" data-music-play aria-pressed="false" aria-label="Включить музыку профиля">
          <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5Z" fill="currentColor"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/></svg>
        </button>
        <span class="music-progress" data-music-progress aria-hidden="true"><span data-music-fill></span></span>
      </div>

      <p class="id-line">
        <span data-active-id></span>
        <span class="balance" data-active-balance hidden></span>
      </p>

      <div class="profile-actions">
        <a class="btn primary" href="/v2/social">Открыть в GhostSocial</a>
        <button class="btn ghost" type="button" data-logout-active>Выйти на устройстве</button>
      </div>
    </section>

    <section class="accounts" data-list-wrap hidden>
      <header class="accounts-head">
        <span data-list-title>Другие аккаунты</span>
        <span class="accounts-count" data-count></span>
      </header>
      <div class="accounts-list" data-list role="list"></div>
      <button class="add-account" type="button" data-add>
        <span class="add-plus" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="add-copy"><strong>Добавить аккаунт</strong><small>войти под другим GhostID</small></span>
      </button>
      <p class="hint" data-hint role="status" aria-live="polite"></p>
    </section>
  </main>

  <div class="modal" data-music-sheet hidden>
    <div class="modal-card sheet" role="dialog" aria-modal="true" aria-labelledby="music-title">
      <button class="modal-close" type="button" data-music-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h2 id="music-title" class="modal-title">Музыка профиля</h2>
      <p class="modal-sub" data-music-count></p>
      <div class="track-list" data-track-list></div>
    </div>
  </div>

  <div class="modal" data-editor hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <button class="modal-close" type="button" data-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h2 id="editor-title" class="modal-title">Профиль GhostID</h2>
      <p class="modal-sub" data-editor-account></p>
      <div class="editor-avatar-row">
        <span class="editor-avatar" data-editor-avatar aria-hidden="true">G</span>
        <div class="editor-avatar-actions">
          <label class="file-btn">
            Загрузить фото
            <input type="file" accept="image/jpeg,image/png,image/webp" data-avatar-input hidden>
          </label>
          <button class="btn ghost small" type="button" data-avatar-remove>Удалить фото</button>
        </div>
      </div>
      <label class="field">
        <span class="field-title">Имя</span>
        <input name="display_name" maxlength="100" autocomplete="name" placeholder="Как к тебе обращаться">
      </label>
      <label class="field">
        <span class="field-title">О себе</span>
        <textarea name="about" maxlength="256" rows="3" placeholder="Коротко о себе"></textarea>
      </label>
      <p class="modal-status" data-editor-status role="status" aria-live="polite"></p>
      <div class="modal-actions">
        <button class="btn ghost" type="button" data-cancel>Отмена</button>
        <button class="btn primary" type="button" data-save>Сохранить</button>
      </div>
    </div>
  </div>

  <script src="/auth/ghostid-accounts.js?v=20261114-accounts-10" defer></script>
  <script src="/auth/id/id.js?v=20261116-3" defer></script>
</body>
</html>
