limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

map $cookie_gs_dev $gs_maint {
    default   0;
    "f429b01b6d64b658df9cf3df"   0;
}

server {
    listen 80;
    server_name ghostecos.duckdns.org;
    include /etc/nginx/snippets/apkextrawaki.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ghostecos.duckdns.org;
    include /etc/nginx/snippets/apkextrawaki.conf;

    ssl_certificate /etc/letsencrypt/live/ghostecos.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostecos.duckdns.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 160M;
    client_body_timeout 120s;
    client_header_timeout 30s;
    keepalive_timeout 15s;
    send_timeout 120s;

    if ($request_uri ~* "^.{300,}$") {
        return 444;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        return 403;
    }

    location = /download/latest {
        proxy_pass http://127.0.0.1:8000/api/download/latest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /download/ {
        alias /opt/ghostchat/site/;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
    }

    location /api/login_request/ {
        limit_req zone=login_limit burst=2 nodelay;
        limit_conn conn_limit 2;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 5;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /login { return 301 /shop/login$is_args$args; }
    location = /profile { return 301 /shop/profile$is_args$args; }
    location = /premium { return 301 /shop/premium$is_args$args; }

    # Статистика на коротком пути /statistics (страница shop :8001)
    location = /shop/statistics { return 301 /statistics; }
    location = /statistics/ { return 301 /statistics; }
    location = /statistics {
        proxy_pass http://127.0.0.1:8001/shop/statistics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location /shop/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /games {
        alias /opt/ghostchat/site/games.html;
        default_type text/html;
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /dialog.js {
        alias /opt/ghostchat/site/dialog.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=600";
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /mesh.js {
        alias /opt/ghostchat/site/mesh.js;
        default_type application/javascript;
    }
    location = /liquid.css {
        alias /opt/ghostchat/site/liquid.css;
        default_type text/css;
        add_header Cache-Control 'public, max-age=300';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /liquid.js {
        alias /opt/ghostchat/site/liquid.js;
        default_type application/javascript;
        add_header Cache-Control 'public, max-age=300';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /social-aug.css {
        alias /opt/ghostchat/site/social-aug.css;
        default_type text/css;
        add_header Cache-Control 'public, max-age=300';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /social-aug.js {
        alias /opt/ghostchat/site/social-aug.js;
        default_type application/javascript;
        add_header Cache-Control 'public, max-age=300';
        include /etc/nginx/snippets/security_headers.conf;
    }


    location = /api/soc/ws {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    location /api/chat/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
    location /api/soc/upload {
        client_max_body_size 160M;
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /api/soc/ {
        client_max_body_size 160M;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Наш новый роут для социальной сети
    # Admin-панель: отдельный файл, exact match (до /social — иначе перехватит)
    location = /__maint.html {
        internal;
        alias /var/www/ghostsocial/maintenance.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security_headers.conf;
    }
    location = /social/__unlock {
        # после анлока сразу с eruda
        add_header Set-Cookie "gs_dev=f429b01b6d64b658df9cf3df; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax" always;
        include /etc/nginx/snippets/security_headers.conf;
        return 302 /social?dev=1;
    }
    location = /social/__lock {
        add_header Set-Cookie "gs_dev=; Path=/; Max-Age=0" always;
        include /etc/nginx/snippets/security_headers.conf;
        return 302 /social?dev=1;
    }
    location = /social/admin {
        alias /var/www/ghostsocial/admin.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security_headers.conf;
    }
    location = /admin { return 301 /social/admin; }
    location = /admin/ { return 301 /social/admin; }

    location /social/media/ {
        alias /var/www/ghostsocial/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security_headers.conf;
    }

    location /social/assets/ {
        alias /var/www/ghostsocial/assets/;
    }
    location /social {
        error_page 503 /__maint.html;
        if ($gs_maint) { return 503; }
        alias /var/www/ghostsocial/;
        index socialprotot.html;
        try_files $uri $uri/ /social/socialprotot.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    # Лендинг GhostChat — отдаём статикой из site-каталога (/opt/ghostchat/site/)
    location = /lend/ghostchat { return 301 /lend/ghostchat/; }
    location /lend/ghostchat/ {
        alias /opt/ghostchat/site/;
        index index.html;
        try_files $uri $uri/ /lend/ghostchat/index.html;
    }

    location = /favicon.png {
        alias /opt/ghostchat/site/favicon.png;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security_headers.conf;
        access_log off;
    }
    location = /apple-touch-icon.png {
        alias /opt/ghostchat/site/apple-touch-icon.png;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security_headers.conf;
        access_log off;
    }
    location = /favicon.jpg {
        alias /opt/ghostchat/site/favicon.jpg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security_headers.conf;
        access_log off;
    }
    location = /favicon.ico {
        alias /opt/ghostchat/site/favicon.png;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security_headers.conf;
        access_log off;
    }
    # Кастомная страница 404 (перехват 404 от бэкенда и от nginx)
    error_page 404 /404.html;
    location = /404.html {
        internal;
        alias /opt/ghostchat/site/404.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /bank { return 301 /bank/$is_args$args; }
    location = /bank/giveaway  { return 301 /bank/giveaway/$is_args$args; }
    location = /bank/giveaway/ {
        root /var/www;
        try_files /bank/giveaway/index.html =404;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security_headers.conf;
    }
    location /bank/ {
        root /var/www;
        index index.html;
        try_files $uri /bank/index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /bank/manifest.json {
        alias /var/www/bank/manifest.json;
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/snippets/security_headers.conf;
    }

    # GhostChat web client (Flutter web). TEMP: access restricted to owner IP only.
    location = /chat { return 301 /chat/$is_args$args; }
    location /chat/ {
        # ВРЕМЕННО открыт для всех (WARP мешал ограничению по IP). Закрыть позже basic-auth.
        root /var/www;          # serves /var/www/chat/...
        index index.html;
        # без $uri/ — иначе nginx пытается листить директорию и даёт 403 вместо index.html
        try_files $uri /chat/index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    # GhostNation — статическая игра (Leaflet + localStorage), отдаём из /var/www/nation/
    location = /nation { return 301 /nation/$is_args$args; }
    location /nation/ {
        root /var/www;
        index index.html;
        try_files $uri /nation/index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    # GhostNation мультиплеер-API → uvicorn :8010 (как /api/soc → 8005)
    location /api/nation/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }


    # Закрытый dev-роут: только для моего IP, остальным 403.
    # /test/socialdiz — экспериментальный дизайн соц-сети (split + liquid glass)
    location /test/ {
        allow 82.15.95.135;
        allow 96.126.129.193;
        deny all;
        root /var/www;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control 'no-store, must-revalidate';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location / {
        limit_conn conn_limit 10;
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
