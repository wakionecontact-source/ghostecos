name: ghogem
description: GhostGem — AI-ассистент и агент GhostEcos (чаты, файлы, память, BYOK).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ─── Сеть ───
  dio: ^5.7.0
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.0

  # ─── Хранилище ───
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.6
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  # flutter_secure_storage временно отключён для Windows сборки без ATL (вернём для Android релиза)
  # flutter_secure_storage: ^10.3.1

  # ─── State ───
  provider: ^6.1.2

  # ─── UI ───
  flutter_svg: ^2.0.10
  flutter_markdown: ^0.7.4
  intl: ^0.20.1
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  app_links: ^6.4.1

  # ─── Файлы/медиа ───
  file_selector: ^1.0.3
  image_picker: ^1.1.2
  open_filex: ^4.5.0
  pasteboard: ^0.4.0
  super_clipboard: ^0.8.18
  desktop_drop: ^0.6.1

  # ─── Desktop ───
  window_manager: ^0.5.1
  tray_manager: ^0.5.2

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0a0710"
  adaptive_icon_foreground: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon.ico

