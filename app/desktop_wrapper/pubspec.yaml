name: ghostecos_desktop
description: GhostEcos — приватный мессенджер с экосистемой (desktop).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_windows: ^0.4.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.1.0
  system_tray: ^2.0.3
  window_manager: ^0.4.3
  flutter_local_notifications: ^17.2.4
  launch_at_startup: ^0.5.1
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  # Native auth + persistence
  http: ^1.2.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # MSIX installer для Windows Store / standalone install
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/icon.ico
    - assets/icon.png

# MSIX (Windows installer) конфиг
msix_config:
  display_name: GhostEcos
  publisher_display_name: GhostEcos
  identity_name: online.ghost_chat.GhostEcos
  msix_version: 0.1.0.0
  logo_path: assets/icon.png
  capabilities: internetClient, microphone
  publisher: CN=GhostEcos
