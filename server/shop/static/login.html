<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · GhostEcos</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <meta http-equiv="refresh" content="0; url=/social">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#020617;--bg-deep:#060a1a;--primary:#a855f7;--primary2:#7c3aed;--text:#f1f5f9;--sub:#94a3b8;}
    html{background:var(--bg);}
    body{min-height:100vh;color:var(--text);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
    body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(80% 60% at 20% 0%,rgba(124,58,237,0.18),transparent 60%),radial-gradient(70% 60% at 100% 100%,rgba(168,85,247,0.12),transparent 60%),linear-gradient(180deg,var(--bg-deep),var(--bg));}
    .wrap{max-width:380px;}
    .spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,0.12);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 22px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:22px;font-weight:800;margin-bottom:8px;}
    p{color:var(--sub);font-size:14px;line-height:1.6;margin-bottom:22px;}
    a.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:12px;background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff;text-decoration:none;font-weight:700;font-size:15px;box-shadow:0 8px 22px rgba(168,85,247,0.3);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>Перенаправляем…</h1>
    <p>Вход через единый аккаунт GhostEcos.<br>Если страница не открылась автоматически:</p>
    <a class="btn" href="/social"><i class="fa-solid fa-arrow-right"></i> Перейти ко входу</a>
  </div>
  <script>location.replace('/social');</script>
</body>
</html>
