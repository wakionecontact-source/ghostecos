# Пример для nginx впереди uvicorn (GhostChat).
# Скопируй в sites-enabled, поправь server_name, upstream и пути к сертификатам.
#
# В http {} (глобально или внутри этого файла через include) один раз:
#
#   limit_conn_zone $binary_remote_addr zone=gc_conn:10m;
#   limit_req_zone  $binary_remote_addr zone=gc_req:10m  rate=30r/s;
#   limit_req_zone  $binary_remote_addr zone=gc_login:10m rate=5r/s;
#
# Под маленький VPS уменьши rate и limit_conn (например rate=10r/s, conn=15).

upstream ghostchat_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Тело запроса не больше, чем разрешает приложение для файлов
    client_max_body_size 100m;

    # Slowloris / висящие клиенты: не держать сокет вечно
    client_header_timeout   10s;
    client_body_timeout     12s;
    send_timeout            30s;
    keepalive_timeout       15s;
    lingering_timeout       5s;
    reset_timedout_connection on;

    # С одного IP — не больше N параллельных соединений к этому server
    limit_conn gc_conn 40;

    location / {
        limit_req zone=gc_req burst=80 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_pass http://ghostchat_app;
    }

    # WebSocket — отдельные таймауты (пинги держат соединение)
    location /ws {
        limit_conn gc_conn 20;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_pass http://ghostchat_app;
    }

    # Без аутентификации — жёстче лимит (poll нового устройства)
    location ~ ^/api/login_request/ {
        limit_req zone=gc_login burst=20 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_body_timeout 5s;
        proxy_read_timeout  30s;

        proxy_pass http://ghostchat_app;
    }
}
