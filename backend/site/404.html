<svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"/></svg>
<svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.5 1.5m11.2 11.2 1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></svg>

<h1 class="enter" id="error-title" style="--delay:.08s" tabindex="-1">Такой страницы<br><em>нет.</em></h1>
<p class="enter" style="--delay:.2s">Похоже, адрес изменился или в нём опечатка. Вернись на главную и продолжай.</p>
</div>

</div>

<script type="module" src="/v2/widgets/404-puzzle.js?v=13"></script>
<script>
const app = document.querySelector(".app");
const themeToggle = document.getElementById("theme-toggle");
let theme = document.documentElement.dataset.theme || "purple";
let themeWaveRunning = false;

function setTheme(value, {persist = true} = {}) {
  theme = value;
  document.documentElement.dataset.theme = value;
  document.querySelector('meta[name="theme-color"]').content = value === "dark" ? "#130d20" : "#351180";
  themeToggle.setAttribute("aria-pressed", String(value === "dark"));
  themeToggle.setAttribute("aria-label", value === "dark" ? "Светлая тема" : "Тёмная тема");
  themeToggle.title = value === "dark" ? "Тёмная тема включена" : "Светлая тема включена";
  if (persist) {
    try { localStorage.setItem("ghostecos-theme", value); } catch {}
    document.cookie = "ghostecos-theme=" + value + "; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
    try {
      const hash = new URLSearchParams(location.hash.slice(1));
      hash.set("theme", value);
      history.replaceState(history.state, "", location.pathname + location.search + "#" + hash);
    } catch {}
  }
}

async function revealTheme(button, value) {
  if (themeWaveRunning) return;
  if (!Element.prototype.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setTheme(value);
    return;
  }

  themeWaveRunning = true;
  const box = button.getBoundingClientRect();
  const x = box.left + box.width / 2;
  const y = box.top + box.height / 2;
  const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 2;
  const preview = document.createElement("div");
  preview.className = "theme-preview";
  preview.dataset.theme = value;
  preview.setAttribute("aria-hidden", "true");
  preview.inert = true;

  const activeScreen = app.querySelector(".screen.active");
  const copy = app.cloneNode(false);
  copy.append(activeScreen.cloneNode(true));
  copy.removeAttribute("id");
  for (const element of copy.querySelectorAll("[id]")) element.removeAttribute("id");
  preview.append(copy);
  document.body.append(preview);

  try {
    const animation = preview.animate(
      {clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + radius + "px at " + x + "px " + y + "px)"]},
      {duration: 560, easing: "cubic-bezier(.33,.2,.25,1)", fill: "both"}
    );
    await animation.finished;
  } catch {
    // The selected theme is still applied if the wave cannot play.
  } finally {
    const root = document.documentElement;
    root.classList.add("theme-commit");
    setTheme(value);
    preview.remove();
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("theme-commit")));
    themeWaveRunning = false;
  }
}

themeToggle.addEventListener("click", () => revealTheme(themeToggle, theme === "dark" ? "purple" : "dark"));
setTheme(theme, {persist: false});

const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const tactileLabels = ".welcome-label";
const tactilePieces = ".welcome-symbol";
const activeMotions = new WeakMap();

function playMotion(node, frames, options) {
  activeMotions.get(node)?.cancel();
  const motion = node.animate(frames, options);
  activeMotions.set(node, motion);
  motion.addEventListener("finish", () => {
    if (activeMotions.get(node) === motion) activeMotions.delete(node);
  }, {once: true});
}

function bounceLabel(label) {
  if (prefersReducedMotion || !label.animate) return;
  playMotion(label, [
    {translate: "0 0", scale: "1", offset: 0},
    {translate: "0 2.5px", scale: ".992", offset: .28},
    {translate: "0 -1.5px", scale: "1.003", offset: .64},
    {translate: "0 0", scale: "1", offset: 1}
  ], {duration: 540, easing: "cubic-bezier(.45,0,.25,1)"});

  for (const piece of label.querySelectorAll(tactilePieces)) {
    playMotion(piece, [
      {translate: "0 0", offset: 0},
      {translate: "0 -3px", offset: .5},
      {translate: "0 0", offset: 1}
    ], {duration: 430, delay: 45, easing: "cubic-bezier(.45,0,.25,1)"});
  }
}

let pressedLabel = null;
app.addEventListener("pointerdown", event => {
  const label = event.target.closest(tactileLabels);
  if (label?.closest(".screen.active")) {
    pressedLabel = {id: event.pointerId, label, x: event.clientX, y: event.clientY, moved: false};
  }
});
app.addEventListener("pointermove", event => {
  if (pressedLabel?.id === event.pointerId && Math.hypot(event.clientX - pressedLabel.x, event.clientY - pressedLabel.y) > 12) {
    pressedLabel.moved = true;
  }
});
app.addEventListener("pointerup", event => {
  if (pressedLabel?.id !== event.pointerId) return;
  const {label, moved} = pressedLabel;
  pressedLabel = null;
  if (!moved && label.isConnected && label.closest(".screen.active")) bounceLabel(label);
});
app.addEventListener("pointercancel", () => { pressedLabel = null; });

const errorCodeLink = document.getElementById("error-code-link");
let errorCodeTaps = 0;
let errorCodeTapTimer = null;

errorCodeLink.addEventListener("click", () => {
  errorCodeTaps += 1;
  clearTimeout(errorCodeTapTimer);

  if (errorCodeTaps >= 3) {
    errorCodeTaps = 0;
    if (window.Ghost404Puzzle) window.Ghost404Puzzle.open();
    return;
  }

  errorCodeTapTimer = setTimeout(() => {
    errorCodeTaps = 0;
    location.assign("/home");
  }, 1200);
});

document.getElementById("go-back").addEventListener("click", () => {
  try {
    if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
      history.back();
      return;
    }
  } catch {}
  location.assign("/home");
});
</script>
