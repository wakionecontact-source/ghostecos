<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GhostRoulette · admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#020617; --surface:rgba(15,23,42,0.6); --border:rgba(255,255,255,0.08);
  --border-s:rgba(255,255,255,0.15);
  --text:#e2e8f0; --sub:#94a3b8; --muted:#64748b;
  --primary:#a855f7; --primary2:#ec4899;
  --green:#10b981; --red:#f43f5e; --yellow:#fbbf24; --cyan:#22d3ee;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;
  min-height:100vh;}
body{background:
  radial-gradient(circle at 20% 0%,rgba(168,85,247,0.15),transparent 50%),
  radial-gradient(circle at 80% 100%,rgba(236,72,153,0.10),transparent 50%),
  var(--bg);}

.shell{max-width:1400px;margin:0 auto;padding:20px;
  display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:900px){ .shell{grid-template-columns:1fr;} }

header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:14px 18px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  backdrop-filter:blur(10px);}
.logo{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:800;font-size:16px;}
.title{font-weight:700;font-size:16px;}
.sub{font-size:11px;color:var(--sub);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:auto;
  transition:background 0.2s;box-shadow:0 0 0 3px rgba(244,63,94,0.15);}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,0.15);}
.dot-label{font-size:12px;color:var(--sub);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  backdrop-filter:blur(10px);overflow:hidden;display:flex;flex-direction:column;}
.card-head{padding:12px 16px;border-bottom:1px solid var(--border);
  font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--sub);display:flex;align-items:center;gap:8px;}
.card-head .right{margin-left:auto;font-size:10px;font-weight:600;color:var(--muted);}
.card-body{padding:14px 16px;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat{padding:12px;background:rgba(0,0,0,0.25);border-radius:10px;
  border:1px solid var(--border);}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;
  letter-spacing:0.05em;font-weight:700;margin-bottom:4px;}
.stat .v{font-size:20px;font-weight:700;color:var(--text);}
.stat .v.small{font-size:13px;font-family:"SF Mono",Menlo,monospace;
  word-break:break-all;color:var(--sub);}

/* Commands */
.cmds{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
.cmd-btn{padding:10px 12px;background:rgba(168,85,247,0.10);
  border:1px solid rgba(168,85,247,0.30);border-radius:10px;color:var(--text);
  font-weight:600;font-size:12px;cursor:pointer;transition:all 0.15s;
  text-align:left;font-family:inherit;}
.cmd-btn:hover{background:rgba(168,85,247,0.20);border-color:rgba(168,85,247,0.55);}
.cmd-btn .nm{font-weight:700;}
.cmd-btn .ds{font-size:10px;color:var(--sub);font-weight:500;margin-top:2px;}

/* Console */
.console{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--border);
  background:rgba(0,0,0,0.25);}
.console input{flex:1;background:rgba(0,0,0,0.4);border:1px solid var(--border-s);
  color:var(--text);padding:9px 12px;border-radius:8px;font-family:"SF Mono",Menlo,monospace;
  font-size:13px;outline:none;}
.console input:focus{border-color:var(--primary);}
.console button{padding:9px 16px;background:linear-gradient(135deg,var(--primary),var(--primary2));
  border:none;color:#fff;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;
  font-size:12px;}

/* Output */
.out{flex:1;overflow-y:auto;padding:14px 16px;font-family:"SF Mono",Menlo,monospace;
  font-size:12px;line-height:1.5;color:var(--sub);max-height:400px;min-height:200px;}
.out pre{margin:0;white-space:pre-wrap;word-break:break-word;}
.out .ts{color:var(--muted);}
.out .cmd-line{color:var(--cyan);margin-top:8px;}
.out .cmd-line::before{content:'$ ';opacity:0.6;}
.out .ok{color:var(--green);}
.out .err{color:var(--red);}

/* Logs */
.logs{flex:1;overflow-y:auto;padding:10px 14px;background:rgba(0,0,0,0.35);
  font-family:"SF Mono",Menlo,monospace;font-size:11.5px;line-height:1.5;
  max-height:560px;min-height:300px;}
.log-row{display:flex;gap:10px;padding:2px 0;}
.log-row .t{color:var(--muted);flex-shrink:0;width:60px;}
.log-row .lv{flex-shrink:0;width:60px;font-weight:700;text-align:center;border-radius:4px;
  font-size:10px;letter-spacing:0.05em;}
.log-row .lv.INFO{background:rgba(34,211,238,0.12);color:var(--cyan);}
.log-row .lv.WARNING{background:rgba(251,191,36,0.15);color:var(--yellow);}
.log-row .lv.ERROR,.log-row .lv.CRITICAL{background:rgba(244,63,94,0.15);color:var(--red);}
.log-row .lv.DEBUG{background:rgba(148,163,184,0.12);color:var(--muted);}
.log-row .m{flex:1;word-break:break-word;color:var(--text);}

/* Scrollbars */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.18);}
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="logo">GR</div>
    <div>
      <div class="title">GhostRoulette</div>
      <div class="sub">admin · localhost:<span id="port">—</span></div>
    </div>
    <div class="dot" id="connDot" title="WS disconnected"></div>
    <span class="dot-label" id="connLabel">подключаюсь...</span>
  </header>

  <!-- Слева: Stats + Commands -->
  <div style="display:flex;flex-direction:column;gap:16px;">
    <div class="card">
      <div class="card-head">
        Статистика
        <span class="right" id="statsAge">—</span>
      </div>
      <div class="card-body">
        <div class="stats" id="statsBox"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Команды</div>
      <div class="card-body">
        <div class="cmds" id="cmdsBox"></div>
      </div>
      <div class="out" id="outBox"></div>
      <div class="console">
        <input id="cmdInput" placeholder="команда args..." autocomplete="off">
        <button onclick="runCmd()">Run</button>
      </div>
    </div>
  </div>

  <!-- Справа: Logs -->
  <div class="card">
    <div class="card-head">
      Логи (real-time)
      <span class="right" id="logCount">0</span>
    </div>
    <div class="logs" id="logsBox"></div>
  </div>
</div>

<script>
const port = location.port || '8088';
document.getElementById('port').textContent = port;

let ws=null, logCount=0;
function setConn(ok){
  const dot=document.getElementById('connDot'), lbl=document.getElementById('connLabel');
  dot.classList.toggle('ok', !!ok);
  lbl.textContent = ok ? 'онлайн' : 'отключён';
  dot.title = ok ? 'WS connected' : 'WS disconnected';
}
function connectWS(){
  ws = new WebSocket(`ws://${location.host}/ws/logs`);
  ws.onopen = () => setConn(true);
  ws.onmessage = (e) => {
    try { addLog(JSON.parse(e.data)); }
    catch(_){}
  };
  ws.onclose = () => { setConn(false); setTimeout(connectWS, 2000); };
  ws.onerror = () => { try{ws.close();}catch(_){ } };
}

function addLog(entry){
  const box = document.getElementById('logsBox');
  const t = new Date(entry.ts*1000);
  const tstr = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
  const row = document.createElement('div');
  row.className = 'log-row';
  row.innerHTML = `<span class="t">${tstr}</span><span class="lv ${entry.level}">${entry.level}</span><span class="m"></span>`;
  row.querySelector('.m').textContent = entry.msg;
  box.appendChild(row);
  // limit DOM size
  while (box.childElementCount > 600) box.removeChild(box.firstChild);
  // autoscroll
  box.scrollTop = box.scrollHeight;
  logCount++;
  document.getElementById('logCount').textContent = logCount;
}

async function loadStats(){
  try {
    const r = await fetch('/api/stats').then(r => r.json());
    const box = document.getElementById('statsBox');
    const hours = Math.floor(r.uptime_sec/3600), mins = Math.floor((r.uptime_sec%3600)/60), secs = r.uptime_sec%60;
    const upt = `${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    box.innerHTML = `
      <div class="stat"><div class="l">Uptime</div><div class="v">${upt}</div></div>
      <div class="stat"><div class="l">Активных (24ч)</div><div class="v">${r.users_active_24h ?? '—'}</div></div>
      <div class="stat"><div class="l">Всего юзеров</div><div class="v">${r.users_total ?? '—'}</div></div>
      <div class="stat"><div class="l">Анкет</div><div class="v">${r.profiles_total ?? '—'}</div></div>
      <div class="stat"><div class="l">Парней</div><div class="v">${r.profiles_male ?? '—'}</div></div>
      <div class="stat"><div class="l">Девушек</div><div class="v">${r.profiles_female ?? '—'}</div></div>
      <div class="stat"><div class="l">Сообщений (сессия)</div><div class="v">${r.messages_total}</div></div>
      <div class="stat"><div class="l">Бан</div><div class="v">${r.users_banned ?? 0}</div></div>
      <div class="stat" style="grid-column:1/-1;"><div class="l">Прокси</div><div class="v small">${esc(r.proxy)}</div></div>
      <div class="stat" style="grid-column:1/-1;"><div class="l">Токен (хвост)</div><div class="v small">…${esc(r.bot_token_tail)}</div></div>
    `;
    const ageEl = document.getElementById('statsAge');
    ageEl.textContent = 'обновлено ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('statsBox').innerHTML = `<div class="stat" style="grid-column:1/-1;color:var(--red);">Не загрузилось: ${esc(e.message)}</div>`;
  }
}

async function loadCmds(){
  try {
    const cmds = await fetch('/api/commands').then(r => r.json());
    const box = document.getElementById('cmdsBox');
    box.innerHTML = cmds.filter(c => c.button).map(c => `
      <button class="cmd-btn" onclick="quickRun(${JSON.stringify(c.name)})">
        <div class="nm">${esc(c.name)}</div>
        <div class="ds">${esc(c.desc)}</div>
      </button>
    `).join('');
  } catch(e) {
    document.getElementById('cmdsBox').innerHTML = `<div style="color:var(--red);font-size:12px;">Не загрузилось</div>`;
  }
}

function quickRun(name){
  document.getElementById('cmdInput').value = name;
  runCmd();
}

async function runCmd(){
  const inp = document.getElementById('cmdInput');
  const line = inp.value.trim();
  if (!line) return;
  const out = document.getElementById('outBox');
  const cmdEl = document.createElement('div');
  cmdEl.className = 'cmd-line';
  cmdEl.textContent = line;
  out.appendChild(cmdEl);
  inp.value = '';
  try {
    const r = await fetch('/api/exec', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ line }),
    }).then(r => r.json());
    const pre = document.createElement('pre');
    pre.textContent = r.output || '(пусто)';
    out.appendChild(pre);
  } catch(e) {
    const pre = document.createElement('pre');
    pre.className = 'err';
    pre.textContent = 'Ошибка: ' + e.message;
    out.appendChild(pre);
  }
  out.scrollTop = out.scrollHeight;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('cmdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runCmd();
});

connectWS();
loadStats();
loadCmds();
setInterval(loadStats, 3000);
</script>
</body>
</html>
