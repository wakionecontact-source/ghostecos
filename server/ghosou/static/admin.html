<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GhoSou / sound admin</title>
  <style>
    :root{color-scheme:dark;--bg:#08070d;--panel:#12101b;--line:#2b2538;--text:#f7f2ff;--muted:#a79db7;--accent:#c084fc;--bad:#fb7185;--good:#86efac}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(80% 50% at 80% 0,#24113f,transparent 60%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(1180px,100%);margin:auto;padding:28px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted)}.panel{border:1px solid var(--line);border-radius:16px;background:rgba(18,16,27,.85);padding:16px;margin:14px 0;box-shadow:0 18px 60px #0005}.login{max-width:360px;margin:14vh auto;padding:0;border:0;background:transparent;box-shadow:none}.login-form{margin:0}.login-form input{height:46px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#0d0b13;color:var(--text)}button{border:1px solid var(--line);border-radius:9px;background:#1a1525;color:var(--text);padding:9px 12px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#7c3aed;border-color:#a855f7}button.danger{border-color:#7f1d1d;color:#fecdd3}.hidden{display:none!important}.status{font-size:12px;color:var(--muted);min-height:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:12px;padding:13px;background:#0e0c15}.card h3{font-size:14px;margin:0 0 6px}.meta{font-size:12px;color:var(--muted);line-height:1.55;word-break:break-word}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#2a2037;color:#dec7ff;font-size:11px}.empty{color:var(--muted);padding:10px 0}.count{color:var(--accent);font-weight:700}
  </style>
</head>
<body>
<main>
  <section id="login" class="panel login">
    <form id="loginForm" class="login-form" autocomplete="off"><input id="token" type="password" autocomplete="current-password" aria-label="Admin token"></form>
  </section>
  <section id="app" class="hidden">
    <header><div><h1>Очередь GhoSou</h1><div class="muted">Ревизии неизменяемы; действия только через эту очередь.</div></div><button id="logoutBtn">Выйти</button></header>
    <div class="status" id="status"></div>
    <section class="panel"><h2>Новые звуки <span class="count" id="soundCount">0</span></h2><div id="sounds" class="grid"></div></section>
    <section class="panel"><h2>Изменения метаданных <span class="count" id="changeCount">0</span></h2><div id="changes" class="grid"></div></section>
    <section class="panel"><h2>Верификация исполнителей <span class="count" id="verifyCount">0</span></h2><div id="verifications" class="grid"></div></section>
  </section>
</main>
<script>
(function(){
  var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var $=function(id){return document.getElementById(id)};
  function call(url,opts){return fetch(url,Object.assign({credentials:'same-origin'},opts||{})).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Ошибка запроса');return d})})}
  function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');load() }
  function authError(e){$('status').textContent=e.message||'Сессия истекла';if(/admin|required|credentials/i.test(e.message||'')){ $('app').classList.add('hidden');$('login').classList.remove('hidden') }}
  function action(url,payload){return call(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(load).catch(authError)}
  function soundCard(t){var verified=t.AuthorVerified?'<span class="badge" style="color:#b9f6c9;background:rgba(31,107,63,.28);border:1px solid rgba(134,239,172,.3)">✓ Проверен</span>':'';var a=t.publication_analysis||{},matches=(a.similar||[]).slice(0,8).map(function(m){return esc((m.title||'Без названия')+' — '+(m.artist||'не указан'))}).join('<br>');var research=(a.research||[]).slice(0,6).map(function(x){var raw=String(x.url||''),href=/^https?:\/\//i.test(raw)?esc(raw):'#';return '<a href="'+href+'" target="_blank" rel="noopener">'+esc(x.title||raw||'Внешний результат')+'</a>'}).join('<br>');var proposed=Object.keys(a.proposed_fields||{}).map(function(k){return esc(k+': '+a.proposed_fields[k])}).join('<br>');var dossier=a.dossier?'<details open><summary>Досье GhoGem</summary><div class="meta dossier">'+esc(a.dossier).replace(/\n/g,'<br>')+'</div></details>':'';var evidence=(matches?'<div class="meta"><strong>Похожие треки</strong><br>'+matches+'</div>':'')+(research?'<div class="meta"><strong>Ресерч</strong><br>'+research+'</div>':'')+(proposed?'<div class="meta"><strong>Предложенные поля</strong><br>'+proposed+'</div>':'');return '<article class="card"><h3>'+esc(t.Title||t.Filename||'Без названия')+' <span class="badge">'+esc(t.Kind||'music')+'</span>'+verified+'</h3><div class="meta">ID: '+esc(t.ID)+'<br>Автор: '+esc(t.AuthorName||t.AnonAuthorID||'не указан')+'<br>Статус: '+esc(t.ModerationStatus||'pending')+' · ревизия '+esc(t.Revision)+'</div>'+((a.warning||dossier||evidence)?'<div class="meta" style="margin-top:10px;color:#fcd34d">'+esc(a.warning||'Автоматический анализ GhoGem')+'</div>'+dossier+evidence:'')+'<div class="actions"><button class="primary" data-sound="'+esc(t.ID)+'" data-action="publish">Опубликовать</button><button class="danger" data-sound="'+esc(t.ID)+'" data-action="reject">Отклонить</button><button data-sound="'+esc(t.ID)+'" data-action="block">Заблокировать</button></div></article>'}
  function changeCard(c){return '<article class="card"><h3>'+esc(c.summary||'Изменение')+'</h3><div class="meta">Звук: '+esc(c.sound_id)+'<br>Автор предложения: '+esc(c.actor_public_id||'anonymous')+'<br>Причина: '+esc(c.reason||'—')+'<br>Статус: '+esc(c.status)+'</div><div class="actions"><button class="primary" data-change="'+esc(c.id)+'" data-action="approve">Одобрить</button><button class="danger" data-change="'+esc(c.id)+'" data-action="reject">Отклонить</button></div></article>'}
  function verificationCard(v){return '<article class="card"><h3>'+esc(v.artist_name||'Исполнитель')+'</h3><div class="meta">Аккаунт: '+esc(v.account_id)+'<br>Сайт: '+esc(v.website||'—')+'<br>Звуков: '+esc((v.sound_ids||[]).join(', ')||'—')+'<br>Доказательства: '+esc(v.evidence||'—')+'</div><div class="actions"><button class="primary" data-verify="'+esc(v.id)+'" data-action="approve">Подтвердить</button><button class="danger" data-verify="'+esc(v.id)+'" data-action="reject">Отклонить</button></div></article>'}
  function load(){return call('/sound/api/admin/summary').then(function(d){var s=d.sounds||[],c=d.changesets||[],v=d.verifications||[];$('soundCount').textContent=s.length;$('changeCount').textContent=c.length;$('verifyCount').textContent=v.length;$('sounds').innerHTML=s.length?s.map(soundCard).join(''):'<div class="empty">Очередь звуков пуста.</div>';$('changes').innerHTML=c.length?c.map(changeCard).join(''):'<div class="empty">Новых изменений нет.</div>';$('verifications').innerHTML=v.length?v.map(verificationCard).join(''):'<div class="empty">Новых заявок нет.</div>';$('status').textContent='Обновлено: '+new Date().toLocaleTimeString()}).catch(authError)}
  $('loginForm').onsubmit=function(e){e.preventDefault();var token=$('token').value;if(!token)return;var input=$('token');input.disabled=true;call('/sound/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})}).then(function(){$('token').value='';showApp()}).catch(function(){input.value=''}).finally(function(){input.disabled=false;input.focus()})};
  $('logoutBtn').onclick=function(){call('/sound/api/admin/logout',{method:'POST'}).finally(function(){$('app').classList.add('hidden');$('login').classList.remove('hidden')})};
  document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.sound){action('/sound/api/admin/sounds/'+encodeURIComponent(b.dataset.sound),{action:b.dataset.action,note:'admin panel'})}else if(b.dataset.change){action('/sound/api/admin/changesets',{id:b.dataset.change,action:b.dataset.action,note:'admin panel'})}else if(b.dataset.verify){action('/sound/api/admin/verifications',{id:b.dataset.verify,action:b.dataset.action,note:'admin panel'})}});
})();
</script>
</body>
</html>
