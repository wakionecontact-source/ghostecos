# GHOSTECOS_SECURITY_20261002: applies before all location/alias rules.
map $uri $ghostecos_private_file {
    default 0;
    "~*(?:^|/)(?:\.git|\.env)(?:/|$|\.)" 1;
    "~*(?:\.(?:py|pyc|go|db|sqlite3?|pem|key|bak|old|orig|save|swp)(?:[._-].*)?|~)$" 1;
}
# Personal VPN egress IP.  An exact empty key skips automated request and
# connection limiting for this address; body-size and timeout safeguards stay
# active.  Do not widen this to a subnet.
geo $gc_rate_limit_key {
    default       $binary_remote_addr;
    96.126.129.193 "";
}
geo $gc_conn_limit_key {
    default       $binary_remote_addr;
    96.126.129.193 "";
}

limit_req_zone $gc_rate_limit_key zone=api_limit:10m rate=120r/m;
limit_req_zone $gc_rate_limit_key zone=login_limit:10m rate=5r/m;
limit_conn_zone $gc_conn_limit_key zone=conn_limit:10m;

# Браузерные запросы к API разрешены только с официальных origin GhostEcos.
# Пустой Origin оставляем для обычной навигации, мобильных клиентов и curl.
map $http_origin $ghostecos_bad_origin {
    default 1;
    "" 0;
    "https://ghostecos.duckdns.org" 0;
    "https://ghostchat.app" 0;
    "https://ghostchats.duckdns.org" 0;
    "https://ghostsocial.duckdns.org" 0;
    "https://ghostwallet.duckdns.org" 0;
}

# ── ПРОФИЛАКТИКА (весь UI, кроме лендинга) ──
# В профилактике доступ к статическим UI разрешён только доверенным IP.
# Cookie больше не является пропуском: любое значение cookie из браузера
# должно оставаться недействительным.
map $remote_addr $gs_maint {
    default   1;
    82.15.95.135  0;
    96.126.129.193 0;
}
map $remote_addr $gc_maint {
    default   1;
    82.15.95.135  0;
    96.126.129.193 0;
}

# GHOSTECOS_MAINTENANCE_ACCESS_V2
include /etc/nginx/snippets/ghostecos-maint-access.conf;

# Любой неизвестный HTTP Host, указывающий на этот сервер, отправляем на
# официальное предупреждение. Это не даёт чужому домену использовать vhost
# GhostEcos как свой сайт.
server {
    listen 80 default_server;
    server_name _;
    return 302 https://ghostecos.duckdns.org/security/phishing;
}

server {
    listen 80;
    server_name ghostecos.duckdns.org ghostchats.duckdns.org ghostsocial.duckdns.org ghostwallet.duckdns.org;
    if ($ghostecos_private_file) { return 404; }
    include /etc/nginx/snippets/apkextrawaki.conf;
    return 301 https://$host$request_uri;
}

# Catch-all HTTPS: сертификат не соответствует чужому домену, но если клиент
# всё равно продолжил соединение, контент GhostEcos ему не отдаём.
server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/ghostecos.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostecos.duckdns.org/privkey.pem;
    return 302 https://ghostecos.duckdns.org/security/phishing;
}

server {
    listen 443 ssl http2;
    server_name ghostecos.duckdns.org ghostchats.duckdns.org ghostsocial.duckdns.org ghostwallet.duckdns.org;
    if ($ghostecos_private_file) { return 404; }
    include /etc/nginx/snippets/apkextrawaki.conf;

    ssl_certificate /etc/letsencrypt/live/ghostecos.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostecos.duckdns.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 8M;
    client_body_timeout 120s;
    client_header_timeout 30s;
    keepalive_timeout 15s;
    send_timeout 120s;

    # Fetch/XHR/WebSocket с постороннего сайта не получает доступ к API и
    # ресурсам экосистемы. Обычная навигация приходит без Origin.
    if ($ghostecos_bad_origin) { return 403; }

    if ($request_uri ~* "^.{300,}$") {
        return 444;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        return 403;
    }

    # No APK is publicly downloadable from any path, including aliases.
    location ~* \.apk$ {
        return 410;
        add_header Cache-Control "no-store" always;
    }

    # Never serve source backups, databases, logs, environment files, or private keys.
    location ~* \.env(?:\..*)?$ {
        return 404;
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(?:bak|backup|db|sqlite|sqlite3|log|pem|key)$ {
        return 404;
        add_header Cache-Control "no-store" always;
    }

    # Public APK route redirects to the version selected by /api/version.
    location = /download/latest {
        proxy_pass http://127.0.0.1:8000/download/latest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /download/latest/ {
        proxy_pass http://127.0.0.1:8000/download/latest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/download/v[0-9]+(?:\.[0-9]+)+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /api/download/latest {
        proxy_pass http://127.0.0.1:8002/api/download/latest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location ~* ^/download/.*\.apk$ {
        return 410;
        add_header Cache-Control "no-store" always;
    }

    location = /download/ghostchattestlatest {
        return 404;
    }

    location = /download {
        return 302 /v2/download$is_args$args;
        add_header Cache-Control "no-store" always;
    }

    location = /download/ {
        return 302 /v2/download$is_args$args;
        add_header Cache-Control "no-store" always;
    }

    location = /v1/download {
        if ($host != ghostecos.duckdns.org) { return 404; }
        alias /opt/ghostchat/site/download/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /v1/download/ {
        return 301 /v1/download$is_args$args;
    }

    location = /v2/download {
        if ($host != ghostecos.duckdns.org) { return 404; }
        alias /var/www/ghostecos-v2/download/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, max-age=0" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /v2/download/ {
        return 301 /v2/download$is_args$args;
    }

    location = /v2/download/version/ {
        return 301 /v2/download/version$is_args$args;
    }

    location = /v2/download/version {
        if ($host != ghostecos.duckdns.org) { return 404; }
        alias /var/www/ghostecos-v2/download/version/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, max-age=0" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    location ^~ /v2/download/assets/ {
        if ($host != ghostecos.duckdns.org) { return 404; }
        alias /var/www/ghostecos-v2/download/assets/;
        add_header Cache-Control "no-store, max-age=0" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    location /download/ {
        alias /opt/ghostchat/site/download/;
        types {
            text/html html;
            text/css css;
            application/javascript js;
            application/json json;
            application/vnd.android.package-archive apk;
        }
        default_type text/html;
    }

    # Public room links render the safe profile/message preview frontend.
    location ~ "^/(c|g)/([A-Za-z0-9_.]{3,64}|[0-9]{1,20})$" {
        alias /opt/ghostchat/site/room_preview.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security_headers.conf;
    }
    location ~ "^/invite/[A-Za-z0-9_-]{16,256}$" {
        alias /opt/ghostchat/site/room_preview.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    location /api/login_request/ {
        limit_req zone=login_limit burst=2 nodelay;
        limit_conn conn_limit 2;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 5;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Единый SSO-вход экосистемы. Эти страницы доступны и во время
    # профилактики продуктов, чтобы авторизация не зависела от их UI.
    location ^~ /auth/ {
        alias /var/www/ghostauth/;
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security_headers.conf;
    }
    location = /auth { return 301 /v2/auth$is_args$args; }
    location = /auth/ { return 301 /v2/auth$is_args$args; }
    location = /login/ { return 301 /v2/auth$is_args$args; }
    location = /register/ { return 301 /v2/auth$is_args$args; }
    location = /login { return 301 /v2/auth$is_args$args; }
    location = /register { return 301 /v2/auth$is_args$args; }
    # GhostEcos v2 account UI. The existing SSO script handles submissions.
    location = /auth/v2 {
        if ($host != ghostecos.duckdns.org) { return 404; }
        alias /var/www/ghostauth/v2/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security_headers.conf;
    }
    location = /auth/v2/ { rewrite ^/auth/v2/$ /auth/v2 last; }
    location = /authv2 { rewrite ^/authv2$ /auth/v2 last; }
    location = /authv2/ { rewrite ^/authv2/$ /auth/v2 last; }

    # GhoGem Mini App uses /v2/auth; serve the same GhostEcos v2 auth screen.
    location = /v2/auth {
        if ($host != ghostecos.duckdns.org) { return 404; }
        alias /var/www/ghostauth/v2/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security_headers.conf;
    }
    location = /v2/auth/ { rewrite ^/v2/auth/$ /v2/auth last; }

    # Полноценный собственный профиль GhostSocial; стартовая панель аккаунта находится на /home.
    location = /profile {
        if ($host != ghostecos.duckdns.org) { return 404; }
        alias /var/www/ghostsocial/socialprotot.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security_headers.conf;
    }
    location = /profile/ {
        if ($host != ghostecos.duckdns.org) { return 404; }
        return 301 /profile$is_args$args;
    }
    location = /premium { return 301 /shop/premium$is_args$args; }

    # Статистика на коротком пути /statistics (страница shop :8001)
    location = /shop/statistics { return 301 /statistics; }
    location = /statistics/ { return 301 /statistics; }
    location = /statistics {
        proxy_pass http://127.0.0.1:8001/shop/statistics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location /shop/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /games {
        alias /opt/ghostchat/site/games.html;
        default_type text/html;
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /security/phishing {
        alias /opt/ghostchat/site/phishing-warning.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /dialog.js {
        alias /opt/ghostchat/site/dialog.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=600";
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /mesh.js {
        alias /opt/ghostchat/site/mesh.js;
        default_type application/javascript;
    }
    location = /liquid.css {
        alias /opt/ghostchat/site/liquid.css;
        default_type text/css;
        add_header Cache-Control 'public, max-age=300';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /ghost-player.css {
        alias /opt/ghostchat/site/ghost-player.css;
        default_type text/css;
        add_header Cache-Control 'no-cache';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /ghost-player.js {
        alias /opt/ghostchat/site/ghost-player.js;
        default_type application/javascript;
        add_header Cache-Control 'no-cache';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /liquid.js {
        alias /opt/ghostchat/site/liquid.js;
        default_type application/javascript;
        add_header Cache-Control 'public, max-age=300';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /social-aug.css {
        alias /opt/ghostchat/site/social-aug.css;
        default_type text/css;
        add_header Cache-Control 'public, max-age=300';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /liquid-megav1.js {
        alias /opt/ghostchat/site/liquid-megav1.js;
        default_type application/javascript;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
        include /etc/nginx/snippets/security_headers.conf;
    }

    location = /social-aug.js {
        alias /opt/ghostchat/site/social-aug.js;
        default_type application/javascript;
        add_header Cache-Control 'public, max-age=300';
        include /etc/nginx/snippets/security_headers.conf;
    }


    location = /api/soc/ws {
        # Браузер передаёт токен в query (WebSocket API не умеет custom headers).
        # До backend отправляем его заголовком и очищаем query, чтобы токен не
        # попадал в access-логи nginx/uvicorn.
        access_log off;
        proxy_set_header X-GS-Token $arg_token;
        proxy_pass http://127.0.0.1:8002/api/soc/ws?;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    location = /download/gc_test {
        return 404;
    }

    # GHOSTCHAT_V2_CLIENT_BEGIN
# Add inside the existing HTTPS server, preserving the entry maintenance guards.
location = /api/chat/v2/client/ws {
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 110s;
    proxy_send_timeout 60s;
    access_log off;
}
location = /api/chat/v2/client/files/upload {
    client_max_body_size 110m;
    limit_req zone=api_limit burst=8 nodelay;
    limit_conn conn_limit 2;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
}
# Insert inside the existing HTTPS server. Maintenance remains enabled.
location ^~ /v2/chat/assets/ui/ {
    if ($host != ghostecos.duckdns.org) { return 404; }
    alias /var/www/ghostchat/v2/assets/ui/;
    types { text/javascript mjs; text/css css; audio/wav wav; }
    default_type application/octet-stream;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security_headers.conf;
}

location ^~ /v2/chat/assets/client/ {
    if ($host != ghostecos.duckdns.org) { return 404; }
    alias /var/www/ghostchat/v2/assets/client/;
    types { text/javascript mjs; }
    default_type text/javascript;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security_headers.conf;
}
location = /v2/shared/crypto/nacl.min.js {
    if ($host != ghostecos.duckdns.org) { return 404; }
    alias /var/www/chat/nacl.min.js;
    default_type text/javascript;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security_headers.conf;
}
location = /v2/shared/crypto/bip39_en.js {
    if ($host != ghostecos.duckdns.org) { return 404; }
    alias /var/www/chat/bip39_en.js;
    default_type text/javascript;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security_headers.conf;
}
location = /v2/shared/crypto/keys_v2.js {
    if ($host != ghostecos.duckdns.org) { return 404; }
    alias /var/www/chat/keys_v2.js;
    default_type text/javascript;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security_headers.conf;
}

# GHOSTCHAT_V2_CLIENT_END

# Large DM attachments are streamed through to the API and stored as files.
location ^~ /api/chat/file/ {
        client_max_body_size 520m;
        client_body_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        limit_req zone=api_limit burst=8 nodelay;
        limit_conn conn_limit 2;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
}

location /api/chat/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn conn_limit 30;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
    location = /api/bots/ws {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /api/bots/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn conn_limit 30;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 65s;
    }
    location /api/support-admin/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn conn_limit 30;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 65s;
    }
    location /api/soc/upload {
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn conn_limit 30;
        limit_req_status 429;
        limit_conn_status 429;
        client_max_body_size 160M;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Keep the legacy GhostChat CAPTCHA URL working while the bot-check
    # service is mounted on the shared /api backend. Proxy directly so Dart
    # clients do not have to replay a redirected POST body.
    location = /api/soc/bot-check/challenge {
        proxy_pass http://127.0.0.1:8002/api/bot-check/challenge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location = /api/soc/bot-check/verify {
        proxy_pass http://127.0.0.1:8002/api/bot-check/verify;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/soc/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn conn_limit 30;
        limit_req_status 429;
        limit_conn_status 429;
