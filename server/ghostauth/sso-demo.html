<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>GhostID · Пример входа</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#351180;color:#fff}
    :root[data-theme=dark]{background:#130d20}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,420px);padding:32px;border-radius:28px;background:rgba(255,255,255,.12)}
    .mark{width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:#fff;color:#351180;margin-bottom:20px}
    svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:32px;letter-spacing:-1px;margin:0 0 12px}p{line-height:1.5;color:#d0b0ff;margin:0 0 24px}
    button,a{font:inherit;cursor:pointer}button{width:100%;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-weight:650;background:#fff;color:#351180}
    button:disabled{opacity:.65;cursor:wait}a{display:inline-block;color:#d0b0ff;margin-top:20px;text-decoration:none}
    .account{display:flex;align-items:center;gap:14px;margin:20px 0}.avatar{width:54px;height:54px;background:#fff;color:#351180;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-weight:700}
    .avatar img{width:100%;height:100%;object-fit:cover}.account strong,.account small{display:block}.account small{color:#d0b0ff;margin-top:5px}
    .status{font-size:14px;min-height:22px;margin:16px 0 0;color:#f4d8ff;overflow-wrap:anywhere}
    :focus-visible{outline:2px solid #d0b0ff;outline-offset:5px}[hidden]{display:none!important}
    @media(max-height:550px){main{padding:22px}.mark{margin-bottom:14px}h1{font-size:27px}p{margin-bottom:14px}}
  </style>
  <script src="/v2/shared/theme-init.js?v=1"></script>
  <script src="/auth/ghostid-sdk.js?v=20261003-2" defer></script>
  <script src="/auth/sso-demo.js?v=20261003-1" defer></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 10V7a6 6 0 0 1 12 0v3M5 10h14v11H5z"/><path d="M12 14v3"/></svg></div>
    <h1>Вход через GhostID</h1>
    <p id="intro">Пример подключения GhostChat к общему входу.</p>
    <div class="account" id="account" hidden><span class="avatar" id="avatar"></span><span><strong id="name"></strong><small id="username"></small></span></div>
    <button id="sign-in" type="button">Продолжить через GhostID</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <a href="/home">На главную</a>
  </main>
</body>
</html>
