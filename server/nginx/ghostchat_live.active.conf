        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

        # Legacy WebSocket clients send JWT/device_id as query parameters.  Move
    # them to private upstream headers and discard the query string so tokens
    # are not written to nginx access logs or propagated to the application.
    location = /ws {
        limit_conn conn_limit 10;
        access_log off;
        proxy_pass http://127.0.0.1:8002/ws?;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-GC-Token $arg_token;
        proxy_set_header X-GC-Device-Id $arg_device_id;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # OTA artifact uploads use a short-lived upload token in the URL; don't
    # write request URIs to access logs. Bearer auth is still checked upstream.
    location ^~ /api/v1/code-ota/uploads/ {
        limit_except POST { deny all; }
        client_max_body_size 260m;
        client_body_timeout 300s;
        access_log off;
        limit_conn conn_limit 10;
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        limit_conn conn_limit 10;
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /ghogem {
        return 301 /ghogem/$is_args$args;
    }
    location /ghogem/ {
        include /etc/nginx/snippets/security_headers.conf;
        alias /var/www/ghogem/;
        try_files $uri $uri/ /ghogem/index.html;
        add_header Cache-Control "no-cache";
    }
    location = /gemo {
        return 301 /gemo/$is_args$args;
    }
    location /gemo/ {
        include /etc/nginx/snippets/security_headers.conf;
        alias /var/www/ghogem/;
        try_files $uri $uri/ /gemo/index.html;
        add_header Cache-Control "no-cache";
    }
    location /ghogem-api/ {
        access_log off;
        client_max_body_size 65M;
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn conn_limit 30;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8021/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /ghosou {
        return 301 /sound/;
    }
    location ^~ /ghosou/ {
        return 301 /sound/;
    }
    location = /sound {
        return 301 /sound/;
    }
    location = /sound/ws {
        proxy_pass http://127.0.0.1:8030/sound/ws;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        access_log off;
    }
    location /sound/ {
        error_page 503 =503 /__chat_maint.html;
        limit_conn conn_limit 10;
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 65M;
        include /etc/nginx/snippets/security_headers.conf;
    }

}
