<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Five Nights — GhostEcos</title>
<style>
  /* ===== база ===== */
  :root{
    --bg:#05060a; --ink:#c9d2dc; --dim:#5b6675;
    --accent:#c0392b;      /* единственный акцент — тревожный красный */
    --amber:#e6a23c;
    --glass:rgba(18,22,30,.72);
    --line:rgba(255,255,255,.06);
    --cam:#7fffa6;         /* зелёный ночного видения */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; user-select:none}
  #app{position:fixed;inset:0;background:#000;overflow:hidden}
  .hidden{display:none !important}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}

  /* экран = слой на весь экран */
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}

  /* ===== общий CRT-оверлей (сканлайны + виньетка) ===== */
  #crt{position:absolute;inset:0;pointer-events:none;z-index:60;mix-blend-mode:overlay;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.0) 0 2px,rgba(0,0,0,.35) 2px 3px);opacity:.5}
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:61;
    background:radial-gradient(120% 120% at 50% 45%,transparent 55%,rgba(0,0,0,.85) 100%)}
  .flicker{animation:flick 6s infinite}
  @keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.78}99%{opacity:.9}}

  /* ===== ТИТУЛЬНЫЙ ===== */
  #title{background:radial-gradient(110% 90% at 50% 30%,#0e1118,#000 75%);z-index:30}
  .logo{font-weight:800;letter-spacing:.18em;text-align:center;line-height:1.05;
    text-shadow:0 0 22px rgba(192,57,43,.55),0 0 4px #000}
  .logo .l1{font-size:clamp(26px,7vw,64px);color:#e9edf2}
  .logo .l2{font-size:clamp(34px,11vw,104px);color:var(--accent);
    animation:buzz 5s infinite}
  @keyframes buzz{0%,92%,100%{opacity:1}93%{opacity:.2}94%{opacity:.9}96%{opacity:.35}}
  .sub{color:var(--dim);margin-top:6px;letter-spacing:.35em;font-size:12px;text-transform:uppercase}
  .menu{margin-top:42px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .btn{min-width:240px;padding:14px 22px;border:1px solid var(--line);border-radius:12px;
    background:var(--glass);color:var(--ink);font-size:15px;letter-spacing:.12em;text-transform:uppercase;
    backdrop-filter:blur(8px);transition:.18s;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn:hover{border-color:rgba(192,57,43,.6);color:#fff;box-shadow:0 0 24px rgba(192,57,43,.18)}
  .btn.ghost{min-width:0;padding:10px 16px;font-size:12px}
  .nights{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center;max-width:340px}
  .nightchip{width:46px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--glass);
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--dim)}
  .nightchip.on{color:#fff;border-color:rgba(192,57,43,.5)}
  .nightchip.locked{opacity:.35;cursor:not-allowed}
  .hint{color:var(--dim);font-size:12px;margin-top:30px;text-align:center;max-width:420px;line-height:1.7;padding:0 16px}
  .credit{position:absolute;bottom:14px;color:#2c333d;font-size:11px;letter-spacing:.2em}

  /* ===== ИНТРО НОЧИ ===== */
  #intro{background:#000;z-index:29}
  .nightbig{font-size:clamp(40px,12vw,120px);font-weight:800;letter-spacing:.05em;color:#e9edf2;
    text-shadow:0 0 30px rgba(0,0,0,1)}
  .inttip{color:var(--dim);margin-top:18px;max-width:460px;text-align:center;line-height:1.8;font-size:14px;padding:0 20px}
  .skip{color:#3a424d;font-size:12px;margin-top:34px;letter-spacing:.2em}

  /* ===== ОФИС (игровой экран) ===== */
  #play{z-index:10;background:#000}
  #office{position:absolute;inset:0;overflow:hidden;background:#000}
  #officeBg{position:absolute;inset:0;width:100%;height:100%}
  /* коридоры — свет и угрозы рисуем поверх SVG-фона */
  .hall{position:absolute;top:0;bottom:0;width:23%;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .12s}
  #hallLeft{left:0} #hallRight{right:0}
  .hall.lit{opacity:1}
  .hallglow{position:absolute;inset:0}
  #hallLeft .hallglow{background:radial-gradient(80% 120% at 10% 50%,rgba(180,190,205,.30),transparent 70%)}
  #hallRight .hallglow{background:radial-gradient(80% 120% at 90% 50%,rgba(180,190,205,.30),transparent 70%)}
  .threat{position:absolute;bottom:-2%;width:74%;filter:drop-shadow(0 0 12px #000)}
  #hallLeft .threat{left:6%} #hallRight .threat{right:6%}
  /* закрытые двери */
  .door{position:absolute;top:0;bottom:0;width:23%;background:
      linear-gradient(90deg,#0a0c10,#1a1f27 50%,#0a0c10);
      border-left:2px solid #000;border-right:2px solid #000;
      transform:translateY(-101%);transition:transform .22s cubic-bezier(.5,0,.3,1);z-index:5}
  .door::after{content:"";position:absolute;inset:0;background:
      repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 14px,rgba(0,0,0,.25) 14px 28px)}
  #doorLeft{left:0} #doorRight{right:0}
  .door.shut{transform:translateY(0)}

  /* кнопки на стенах офиса */
  .wallpanel{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:8}
  #panelLeft{left:2.5%} #panelRight{right:2.5%}
  .wbtn{width:74px;height:60px;border:1px solid rgba(255,255,255,.10);border-radius:12px;
    background:rgba(10,12,16,.7);backdrop-filter:blur(6px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;color:var(--dim);transition:.12s}
  .wbtn svg{width:24px;height:24px}
  .wbtn small{font-size:9px;letter-spacing:.12em;text-transform:uppercase}
  .wbtn.on{color:#fff;border-color:var(--accent);background:rgba(192,57,43,.22);
    box-shadow:0 0 18px rgba(192,57,43,.35)}
  .wbtn:active{transform:scale(.94)}

  /* HUD */
  #hud{position:absolute;left:0;right:0;bottom:0;z-index:9;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-end;padding:16px 18px}
  .pwrbox{background:rgba(6,8,12,.55);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;min-width:190px}
  .pwrtop{display:flex;align-items:baseline;gap:8px;font-size:13px;letter-spacing:.1em}
  .pwrtop b{font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
  .pwrtop b.low{color:var(--accent);animation:lowblink 1s infinite}
  @keyframes lowblink{50%{opacity:.4}}
  .usage{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--dim);letter-spacing:.1em}
  .bars{display:flex;gap:3px}
  .bar{width:13px;height:16px;border-radius:2px;background:#222831}
  .bar.f1{background:#7fb069}.bar.f2{background:#cdbf4a}.bar.f3{background:#d98f3a}
  .bar.f4{background:#cf5a3a}.bar.f5{background:#c0392b}
  .clock{text-align:right;background:rgba(6,8,12,.55);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:12px;padding:8px 16px}
  .clock .t{font-size:30px;font-weight:800;color:#fff;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .clock .n{font-size:11px;color:var(--dim);letter-spacing:.25em;text-transform:uppercase}

  /* кнопка камер снизу-центр */
  #camHandle{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:9;
    width:240px;height:30px;display:flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(0deg,rgba(192,57,43,.18),transparent);color:var(--dim);
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;border-top:1px solid var(--line)}
  #camHandle:hover{color:#fff}
  #camHandle .chev{animation:chevup 1.4s infinite}
  @keyframes chevup{50%{transform:translateY(-3px)}}

  /* верхняя панель: меню / звук */
  #topbar{position:absolute;top:0;left:0;right:0;z-index:9;display:flex;justify-content:space-between;padding:12px 14px;pointer-events:none}
  #topbar .wbtn{width:42px;height:38px;pointer-events:auto}
  #topbar .wbtn svg{width:18px;height:18px}

  /* ===== МОНИТОР КАМЕР ===== */
  #monitor{position:absolute;inset:0;z-index:20;background:#04060a;opacity:0;
    transform:translateY(2%) scale(1.01);transition:.18s;pointer-events:none}
  #monitor.up{opacity:1;transform:none;pointer-events:auto}
  #camView{position:absolute;inset:0;overflow:hidden;background:#05140b}
  #camScene{position:absolute;inset:0;width:100%;height:100%}
  #camStatic{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.10}
  .camtint{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 40%,rgba(60,255,140,.06),rgba(0,0,0,.5) 90%);
    box-shadow:inset 0 0 140px rgba(0,0,0,.9)}
  .camscan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.28) 3px 4px)}
  #camLabel{position:absolute;top:18px;left:20px;color:var(--cam);font-family:"Courier New",monospace;
    font-size:14px;letter-spacing:.12em;text-shadow:0 0 8px rgba(60,255,140,.5);z-index:3}
  #camRec{position:absolute;top:18px;right:22px;color:#ff5252;font-family:"Courier New",monospace;
    font-size:13px;letter-spacing:.1em;display:flex;align-items:center;gap:7px;z-index:3}
  #camRec .dot{width:9px;height:9px;border-radius:50%;background:#ff5252;animation:lowblink 1.1s infinite}
  #scanline{position:absolute;left:0;right:0;height:90px;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(120,255,170,.05),transparent);animation:scanmove 7s linear infinite}
  @keyframes scanmove{0%{top:-90px}100%{top:100%}}

  /* карта камер */
  #map{position:absolute;right:18px;bottom:18px;width:min(40vw,320px);aspect-ratio:1.35/1;z-index:4;
    background:rgba(4,8,6,.82);border:1px solid rgba(120,255,170,.18);border-radius:10px;padding:8px}
  #mapSvg{width:100%;height:100%}
  .cambtn{cursor:pointer}
  .cambtn rect{transition:.12s}
  #camDown{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:5;
    width:240px;height:30px;display:flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(180deg,rgba(120,255,170,.14),transparent);color:#9affc4;
    font-size:11px;letter-spacing:.3em;text-transform:uppercase}
  #camDown .chev{animation:chevdn 1.4s infinite}
  @keyframes chevdn{50%{transform:translateY(3px)}}
  /* предупреждение «Фокси бежит» / помехи */
  #signalLost{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
    color:#9affc4;font-family:"Courier New",monospace;letter-spacing:.2em;font-size:18px;opacity:0;pointer-events:none}

  /* ===== СКРИМЕР ===== */
  #scare{position:absolute;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
  #scare.go{opacity:1}
  #scare svg{width:min(95vw,95vh);height:min(95vw,95vh);animation:shake .06s infinite}
  @keyframes shake{0%{transform:translate(0,0) scale(1.02)}25%{transform:translate(-14px,8px) scale(1.06)}
    50%{transform:translate(12px,-10px) scale(1.0)}75%{transform:translate(-8px,-6px) scale(1.05)}100%{transform:translate(10px,9px) scale(1.03)}}
  #redflash{position:absolute;inset:0;z-index:79;background:#c0392b;opacity:0;pointer-events:none;mix-blend-mode:multiply}

  /* ===== ИСХОД ночи ===== */
  #over,#win{z-index:40;background:#000}
  .bigword{font-size:clamp(34px,9vw,84px);font-weight:800;letter-spacing:.08em}
  #over .bigword{color:var(--accent);text-shadow:0 0 24px rgba(192,57,43,.4)}
  #win .bigword{color:#7fb069;text-shadow:0 0 24px rgba(127,176,105,.4)}
  .six{font-size:clamp(50px,16vw,150px);font-weight:800;color:#fff}

  /* power-out тьма + музыкальная шкатулка */
  #powerout{position:absolute;inset:0;z-index:15;background:#000;opacity:0;transition:opacity .6s;pointer-events:none}
  #powerout.on{opacity:1}
  #freddyEyes{position:absolute;left:14%;top:46%;width:120px;opacity:0;transition:opacity 1s}

  @media (max-width:640px){
    .wbtn{width:60px;height:52px} .pwrbox{min-width:150px}
    #map{width:46vw}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ ТИТУЛЬНЫЙ ============ -->
  <section id="title" class="scene flicker">
    <div class="logo">
      <div class="l1">FIVE NIGHTS</div>
      <div class="l2">at GHOST'S</div>
    </div>
    <div class="sub">security · night shift</div>
    <div class="menu">
      <button class="btn" id="btnNew"><span>Новая игра</span></button>
      <div class="nights" id="nightSelect"></div>
    </div>
    <div class="hint" id="ctrlHint"></div>
    <div class="credit">GhostEcos · по приколу</div>
  </section>

  <!-- ============ ИНТРО НОЧИ ============ -->
  <section id="intro" class="scene hidden">
    <div class="nightbig" id="introNight">Ночь 1</div>
    <div class="inttip" id="introTip"></div>
    <div class="skip">клик / пробел — пропустить</div>
  </section>

  <!-- ============ ИГРА ============ -->
  <section id="play" class="scene hidden">
    <div id="office">
      <!-- фон офиса (рисуется SVG) -->
      <svg id="officeBg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"></svg>

      <!-- коридоры (свет + угроза) -->
      <div class="hall" id="hallLeft"><div class="hallglow"></div><div class="threat" id="threatLeft"></div></div>
      <div class="hall" id="hallRight"><div class="hallglow"></div><div class="threat" id="threatRight"></div></div>

      <!-- двери -->
      <div class="door" id="doorLeft"></div>
      <div class="door" id="doorRight"></div>

      <!-- power-out тьма -->
      <div id="powerout"><svg id="freddyEyes" viewBox="0 0 200 200"></svg></div>

      <!-- настенные кнопки -->
      <div class="wallpanel" id="panelLeft">
        <button class="wbtn" id="btnDoorL"><svg id="icoDoorL"></svg><small>дверь</small></button>
        <button class="wbtn" id="btnLightL"><svg id="icoLightL"></svg><small>свет</small></button>
      </div>
      <div class="wallpanel" id="panelRight">
        <button class="wbtn" id="btnDoorR"><svg id="icoDoorR"></svg><small>дверь</small></button>
        <button class="wbtn" id="btnLightR"><svg id="icoLightR"></svg><small>свет</small></button>
      </div>

      <!-- верхняя панель -->
      <div id="topbar">
        <button class="wbtn" id="btnQuit" title="в меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        <button class="wbtn" id="btnMute" title="звук"><svg id="icoMute"></svg></button>
      </div>

      <!-- HUD -->
      <div id="hud">
        <div class="pwrbox">
          <div class="pwrtop"><span>Заряд</span><b id="pwrVal">100</b><span>%</span></div>
          <div class="usage"><span>Расход</span><div class="bars" id="usageBars"></div></div>
        </div>
        <div class="clock">
          <div class="t" id="clockT">12 AM</div>
          <div class="n" id="clockN">Ночь 1</div>
        </div>
      </div>

      <!-- ручка камер -->
      <button id="camHandle"><span class="chev">▲</span> Камеры <span class="chev">▲</span></button>
    </div>

    <!-- ====== монитор камер ====== -->
    <div id="monitor">
      <div id="camView">
        <svg id="camScene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice"></svg>
        <div id="scanline"></div>
        <svg id="camStatic" viewBox="0 0 100 100" preserveAspectRatio="none"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100" height="100" filter="url(#noise)"/></svg>
        <div class="camtint"></div>
        <div class="camscan"></div>
        <div id="camLabel">CAM 1A · SHOW STAGE</div>
        <div id="camRec"><span class="dot"></span>REC</div>
        <div id="signalLost"></div>
      </div>
      <div id="map"><svg id="mapSvg" viewBox="0 0 340 250"></svg></div>
      <button id="camDown"><span class="chev">▼</span> Опустить <span class="chev">▼</span></button>
    </div>
  </section>

  <!-- ============ СКРИМЕР ============ -->
  <div id="redflash"></div>
  <div id="scare"><svg id="scareSvg" viewBox="0 0 200 200"></svg></div>

  <!-- ============ GAME OVER / WIN ============ -->
  <section id="over" class="scene hidden">
    <div class="bigword">Тебя нашли</div>
    <div class="hint" id="overSub">Ночь не пройдена.</div>
    <div class="menu" style="margin-top:30px">
      <button class="btn" id="btnRetry">Ещё раз</button>
      <button class="btn ghost" id="btnOverMenu">В меню</button>
    </div>
  </section>

  <section id="win" class="scene hidden">
    <div class="six" id="winSix">6 AM</div>
    <div class="bigword" style="font-size:clamp(24px,6vw,52px);margin-top:8px">Ты выжил</div>
    <div class="hint" id="winSub"></div>
    <div class="menu" style="margin-top:24px">
      <button class="btn" id="btnNext">Дальше</button>
      <button class="btn ghost" id="btnWinMenu">В меню</button>
    </div>
  </section>

  <!-- глобальные оверлеи -->
  <div id="crt"></div>
  <div id="vignette"></div>
</div>

<script>
"use strict";
/* =========================================================================
   FIVE NIGHTS at GHOST'S  —  один файл, без зависимостей.
   Вся логика классического FNAF1: камеры, двери, свет, энергия, ИИ-аниматроники.
   Звук синтезируется (Web Audio), графика — SVG. Эмодзи нет, только свои иконки.
   ========================================================================= */

const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd = (a,b)=>a+Math.random()*(b-a);
const chance = p => Math.random() < p;

/* ---------- настройки баланса (легко крутить) ---------- */
const HOUR_MS = 48000;            // длина одного игрового часа (12->1 AM). Ночь = 6 часов ≈ 4.8 мин
const LIGHT_MS = 1400;            // свет «моргает» и гаснет сам
const FOXY_RUN_WARN = 1700;       // пауза между «Фокси побежал» и ударом в дверь
const DOOR_DRAIN = 6;             // % заряда, что съедает удар Фокси в закрытую дверь

/* ИИ-уровни по ночам (0..20 — шанс хода). Растут как в оригинале. */
const AI = {
  //        bonnie chica foxy freddy
  1:{bonnie:2, chica:1, foxy:1, freddy:0},
  2:{bonnie:4, chica:3, foxy:3, freddy:1},
  3:{bonnie:6, chica:5, foxy:5, freddy:2},
  4:{bonnie:9, chica:8, foxy:7, freddy:4},
  5:{bonnie:12,chica:11,foxy:9, freddy:6},
};
const TIPS = {
  1:"Ночной сторож. Сиди тихо, поглядывай на камеры. Свет в коридоре покажет, кто пришёл — увидел, закрывай дверь. Но следи за зарядом: к утру он не должен сесть.",
  2:"Бонни и Чика осмелели. Фокси в Пиратской бухте — если редко смотреть на CAM 1C, он сорвётся и побежит к ЛЕВОЙ двери.",
  3:"Закрытая дверь и горящий свет жрут энергию вдвое. Закрывай только когда реально кто-то у двери.",
  4:"Фредди проснулся. Он идёт справа и двигается, только пока на него НЕ смотрят в камеру. И он добьёт, если сядет заряд.",
  5:"Все на максимуме. Удачи, сторож.",
};

/* ---------- маршруты к офису (узлы = id камер) ---------- */
/* последний узел = угол у двери. side: какая дверь. */
const PATHS = {
  bonnie:{nodes:["1A","1B","2A","2B"], side:"L"},
  chica :{nodes:["1A","1B","4A","4B"], side:"R"},
  freddy:{nodes:["1A","1B","7","4A","4B"], side:"R"},
};
const CAM_NAMES = {
  "1A":"SHOW STAGE","1B":"DINING AREA","1C":"PIRATE COVE","5":"BACKSTAGE",
  "7":"KITCHEN","2A":"WEST HALL","2B":"W. HALL CORNER","4A":"EAST HALL","4B":"E. HALL CORNER",
};
const CAM_ORDER = ["1A","1B","1C","5","7","2A","2B","4A","4B"];

/* ===================== СОСТОЯНИЕ ===================== */
let G = null;            // текущая игра
let unlocked = 1;        // открытые ночи
try{ unlocked = clamp(parseInt(localStorage.getItem('fnaf_unlocked')||'1'),1,5); }catch(e){}
let muted = false;
let loop = null, raf = null;

function newGame(night){
  G = {
    night, t:0, power:100, over:false, won:false,
    camsUp:false, cam:"1A", lastCamLook:0,
    doorL:false, doorR:false, lightL:0, lightR:0,   // light* = таймстамп до которого горит
    chars:{}, powerOut:false, powerOutT:0, foxyAt:null,
  };
  const a = AI[night];
  G.chars.bonnie = {name:"bonnie", ai:a.bonnie, state:"roam", idx:0, cd:rnd(4,7), iv:5.0, side:"L"};
  G.chars.chica  = {name:"chica",  ai:a.chica,  state:"roam", idx:0, cd:rnd(4,7), iv:5.2, side:"R"};
  G.chars.freddy = {name:"freddy", ai:a.freddy, state:"roam", idx:0, cd:rnd(6,9), iv:6.0, side:"R"};
  G.chars.foxy   = {name:"foxy",   ai:a.foxy,   state:"cove", stage:0, cd:rnd(5,8), iv:5.2, side:"L"};
}

/* ===================== ПОТОК ЭКРАНОВ ===================== */
function show(id){ ["title","intro","play","over","win"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); }

function startNight(night){
  newGame(night);
  // интро
  show("intro");
  $("introNight").textContent = "Ночь "+night;
  $("introTip").textContent = TIPS[night]||"";
  ensureAudio();
  let skipped=false;
  const go=()=>{ if(skipped)return; skipped=true; window.removeEventListener("keydown",onk); $("intro").removeEventListener("click",go); beginPlay(); };
  const onk=e=>{ if(e.code==="Space"||e.code==="Enter")go(); };
  window.addEventListener("keydown",onk);
  $("intro").addEventListener("click",go);
  setTimeout(go, 5200);
}

function beginPlay(){
  show("play");
  G.t=0; G.power=100; G.camsUp=false; lowerCams(true);
  renderOffice(); renderHUD(); applyDoors(); renderThreats();
  startAmbient();
  if(loop) clearInterval(loop);
  loop = setInterval(update, 50);          // логика 20 раз/сек
  if(raf) cancelAnimationFrame(raf);
  const draw=()=>{ if(G&&!G.over&&!G.won){ jitterStatic(); raf=requestAnimationFrame(draw);} };
  draw();
}

function endNight(win){
  if(!G||G.over||G.won) return;
  clearInterval(loop); loop=null;
  stopAmbient();
  if(win){
    G.won=true;
    if(G.night>=unlocked && G.night<5){ unlocked=G.night+1; try{localStorage.setItem('fnaf_unlocked',unlocked);}catch(e){} }
    playChime();
    show("win");
    $("winSix").textContent="6 AM";
    if(G.night>=5){ $("winSub").textContent="Пять ночей позади. Ты справился со сменой. Кошмар окончен… или нет."; $("btnNext").textContent="Финал"; }
    else { $("winSub").textContent="Ночь "+G.night+" пройдена. Заряд под утро: "+Math.round(G.power)+"%."; $("btnNext").textContent="Ночь "+(G.night+1); }
  }
}

/* ===================== ОСНОВНОЙ ЦИКЛ ===================== */
function update(){
  if(!G||G.over||G.won) return;
  const dt=0.05;
  // время
  G.t += HOUR_MS*0.001*0 + 50;     // в мс
  const hour = Math.floor(G.t/HOUR_MS);
  if(hour>=6){ endNight(true); return; }

  // свет гаснет сам
  const now=G.t;
  if(G.lightL && now>G.lightL) G.lightL=0;
  if(G.lightR && now>G.lightR) G.lightR=0;

  // энергия
  if(!G.powerOut){
    const u = usage();
    const drain = (0.10 + 0.14*(u-1)) * dt;   // %/сек * dt
    G.power = clamp(G.power - drain, 0, 100);
    if(G.power<=0){ startPowerOut(); }
  } else {
    // тьма: Фредди готовится
    G.powerOutT += 50;
    if(G.powerOutT>G.powerOutKill){ jumpscare("freddy"); return; }
  }

  // ИИ
  if(!G.powerOut){
    moveChar(G.chars.bonnie, dt);
    moveChar(G.chars.chica, dt);
    moveFreddy(G.chars.freddy, dt);
    moveFoxy(G.chars.foxy, dt);
  }

  // отрисовка
  renderHUD();
  if(G.camsUp) renderCam();
  renderThreats();
}

function rollAI(c){ return Math.random()*20 < c.ai; }

/* Бонни / Чика */
function moveChar(c, dt){
  if(c.state==="roam"){
    c.cd -= dt;
    if(c.cd<=0){
      c.cd = c.iv*rnd(0.8,1.25);
      if(rollAI(c)) advance(c);
    }
  } else if(c.state==="door"){
    c.doorCd -= dt;
    if(c.doorCd<=0){
      const shut = c.side==="L"?G.doorL:G.doorR;
      if(shut){ retreat(c); }
      else { jumpscare(c.name); }
    }
  }
}
function advance(c){
  const p = PATHS[c.name];
  if(c.idx < p.nodes.length-1){
    c.idx++;
    if(c.idx===p.nodes.length-1){     // дошёл до угла у двери
      c.state="door"; c.doorCd=rnd(3.5,6.5);
      cueAtDoor(c.side);
    } else {
      sfxStep();
    }
  }
}
function retreat(c){
  c.state="roam";
  c.idx = clamp(c.idx-2, 0, PATHS[c.name].nodes.length-2);
  c.cd = c.iv*rnd(1.0,1.6);
  sfxRetreat();
}

/* Фредди — как Чика, но шевелится только когда на него НЕ смотрят */
function moveFreddy(c, dt){
  if(c.state==="door"){ moveChar(c,dt); return; }
  c.cd -= dt;
  if(c.cd<=0){
    c.cd = c.iv*rnd(0.9,1.4);
    const node = PATHS.freddy.nodes[c.idx];
    const watched = G.camsUp && G.cam===node;     // смотрим на его комнату — он замер
    if(!watched && rollAI(c)){ advance(c); if(c.idx>0) sfxLaugh(); }
  }
}

/* Фокси — 4 стадии в бухте, потом забег к левой двери */
function moveFoxy(c, dt){
  if(c.state==="cove"){
    const watchingCove = G.camsUp && G.cam==="1C";
    c.cd -= dt;
    if(watchingCove){ c.cd = Math.max(c.cd, c.iv*0.8); }   // смотрим на бухту — тормозим его
    if(c.cd<=0){
      c.cd = c.iv*rnd(0.8,1.2);
      if(!watchingCove && rollAI(c)){
        c.stage++;
        if(c.stage>=4){ c.state="run"; c.runCd=FOXY_RUN_WARN/1000; sfxFoxyRun(); }
      }
    }
  } else if(c.state==="run"){
    c.runCd -= dt;
    if(c.runCd<=0){
      if(G.doorL){           // успел закрыть — удар, минус заряд
        G.power = clamp(G.power-DOOR_DRAIN,0,100);
        sfxBang(); c.state="cove"; c.stage=0; c.cd=rnd(6,10);
      } else { jumpscare("foxy"); }
    }
  }
}

/* кто-то встал у двери — подсказка звуком */
function cueAtDoor(side){ sfxBreath(); }

/* ===================== POWER OUT ===================== */
function startPowerOut(){
  G.powerOut=true; G.powerOutT=0; G.powerOutKill=rnd(4000,11000);
  // всё вырубается
  G.doorL=G.doorR=false; G.lightL=G.lightR=0; if(G.camsUp) lowerCams();
  applyDoors(); renderThreats();
  $("powerout").classList.add("on");
  $("freddyEyes").innerHTML = charSVG("freddy","eyes");
  setTimeout(()=>{ if(G&&G.powerOut) $("freddyEyes").style.opacity=1; }, rnd(800,2500));
  stopAmbient(); playMusicBox();
}

/* ===================== СКРИМЕР ===================== */
function jumpscare(name){
  if(!G||G.over) return;
  G.over=true; clearInterval(loop); loop=null;
  stopAmbient(); stopMusicBox();
  $("scareSvg").innerHTML = charSVG(name,"scare");
  $("scare").classList.add("go");
  $("redflash").style.opacity=.5;
  playScream();
  if(navigator.vibrate) try{navigator.vibrate([90,40,160]);}catch(e){}
  setTimeout(()=>{
    $("scare").classList.remove("go");
    $("redflash").style.opacity=0;
    $("powerout").classList.remove("on"); $("freddyEyes").style.opacity=0;
    show("over");
    $("overSub").textContent = "Ночь "+G.night+" · "+clockLabel()+". "+ deathLine(name);
  }, 1250);
}
function deathLine(n){
  return ({freddy:"Фредди добрался до тебя.",bonnie:"Бонни стоял в дверях.",
    chica:"Чика была у правой двери.",foxy:"Фокси добежал. Надо было закрывать левую."})[n]||"";
}

/* ===================== РАСХОД / HUD ===================== */
function usage(){
  let u=1;
  if(G.doorL)u++; if(G.doorR)u++;
  if(G.lightL||G.lightR)u++;
  if(G.camsUp)u++;
  return clamp(u,1,5);
}
function clockLabel(){
  const h=Math.floor(G.t/HOUR_MS);
  return (h===0?12:h)+" AM";
}
function renderHUD(){
  $("clockT").textContent = clockLabel();
  $("clockN").textContent = "Ночь "+G.night;
  const p=Math.round(G.power);
  const el=$("pwrVal"); el.textContent=p; el.classList.toggle("low", p<=20);
  const u=usage();
  const bars=$("usageBars");
  if(bars.childElementCount!==5){ bars.innerHTML=""; for(let i=0;i<5;i++){const b=document.createElement("div");b.className="bar";bars.appendChild(b);} }
  [...bars.children].forEach((b,i)=>{ b.className="bar"+(i<u?(" f"+u):""); });
}

/* ===================== ОФИС: УГРОЗЫ В ДВЕРЯХ ===================== */
function renderThreats(){
  const L=$("hallLeft"), R=$("hallRight");
  L.classList.toggle("lit", !!G.lightL && !G.powerOut);
  R.classList.toggle("lit", !!G.lightR && !G.powerOut);
  // кто у левой двери?
  $("threatLeft").innerHTML = (G.lightL && threatAt("L")) ? charSVG(threatAt("L"),"door") : "";
  $("threatRight").innerHTML = (G.lightR && threatAt("R")) ? charSVG(threatAt("R"),"door") : "";
}
function threatAt(side){
  for(const k of ["bonnie","chica","freddy"]){
    const c=G.chars[k];
    if(c.state==="door" && c.side===side) return c.name;
  }
  return null;
}

/* ===================== ДВЕРИ / СВЕТ / КАМЕРЫ ===================== */
function toggleDoor(side){
  if(G.powerOut) return;
  if(side==="L"){ G.doorL=!G.doorL; $("btnDoorL").classList.toggle("on",G.doorL); $("doorLeft").classList.toggle("shut",G.doorL); }
  else { G.doorR=!G.doorR; $("btnDoorR").classList.toggle("on",G.doorR); $("doorRight").classList.toggle("shut",G.doorR); }
  sfxDoor();
}
function applyDoors(){
  $("btnDoorL").classList.toggle("on",G.doorL); $("doorLeft").classList.toggle("shut",G.doorL);
  $("btnDoorR").classList.toggle("on",G.doorR); $("doorRight").classList.toggle("shut",G.doorR);
}
function flickLight(side){
  if(G.powerOut) return;
  if(side==="L") G.lightL = G.lightL? 0 : G.t+LIGHT_MS;
  else G.lightR = G.lightR? 0 : G.t+LIGHT_MS;
  $("btnLightL").classList.toggle("on",!!G.lightL);
  $("btnLightR").classList.toggle("on",!!G.lightR);
  sfxLight(); renderThreats();
}
function raiseCams(){
  if(G.powerOut||G.camsUp) return;
  G.camsUp=true; $("monitor").classList.add("up");
  // опустить свет (нельзя одновременно)
  sfxCamUp(); renderCam();
}
function lowerCams(silent){
  G.camsUp=false; $("monitor").classList.remove("up");
  if(!silent) sfxCamDown();
}
function selectCam(id){
  G.cam=id; G.lastCamLook=G.t; sfxBlip(); renderCam();
}

/* ===================== КАМЕРА: СЦЕНА ===================== */
function renderCam(){
  $("camLabel").textContent = "CAM "+G.cam+" · "+CAM_NAMES[G.cam];
  // кто в этой комнате?
  const here=[];
  for(const k of ["bonnie","chica","freddy"]){
    const c=G.chars[k]; const node=PATHS[c.name].nodes[c.idx];
    if(c.state!=="door" && node===G.cam) here.push(c.name);
    if(c.state==="door"){ /* в углу 2B/4B */ if(PATHS[c.name].nodes[c.idx]===G.cam) here.push(c.name); }
  }
  const foxy=G.chars.foxy;
  $("camScene").innerHTML = camSceneSVG(G.cam, here, foxy);
  // если Фокси бежит — на CAM 1C «нет сигнала»
  const sl=$("signalLost");
  if(G.cam==="1C" && foxy.state==="run"){ sl.textContent="— SIGNAL LOST —"; sl.style.opacity=.85; }
  else { sl.style.opacity=0; }
  // обновить карту (подсветка текущей)
  renderMap();
}
function jitterStatic(){
  const s=$("camStatic");
  if(G&&G.camsUp){ s.style.transform="translate("+(Math.random()*4-2)+"px,"+(Math.random()*4-2)+"px)"; s.style.opacity=(0.06+Math.random()*0.08).toFixed(3); }
}

/* ===================== РЕНДЕР СТАТИКИ ОФИСА/КАРТЫ ===================== */

/* =========================================================================
   ГРАФИКА: SVG персонажей и сцен
   ========================================================================= */
/* charSVG(name, mode) — mode: "scare"|"door"|"room"|"eyes" */

  let body="";
  if(name==="freddy"){

      <ellipse cx="100" cy="110" rx="64" ry="66" fill="${fur}"/>
      <ellipse cx="100" cy="138" rx="40" ry="34" fill="${muz}"/>
      ${eye(76,98,scare,"#e23b3b")} ${eye(124,98,scare,"#e23b3b")}
      ${scare?bigMouth(100,144,34,"#160a18"):`<rect x="90" y="138" width="9" height="16" fill="#efeae0"/><rect x="101" y="138" width="9" height="16" fill="#efeae0"/><path d="M74 134 Q100 158 126 134" stroke="#0a0a0c" stroke-width="3" fill="none"/>`}

      <circle cx="125" cy="97" r="5" fill="#ffd24a"/>

    return `<defs><filter id="ge" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter></defs>
      <circle cx="74" cy="100" r="9" fill="${col}" filter="url(#ge)"/><circle cx="126" cy="100" r="9" fill="${col}" filter="url(#ge)"/>
      <circle cx="74" cy="100" r="4" fill="#fff"/><circle cx="126" cy="100" r="4" fill="#fff"/>`;
  }
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%" ${glow}>${eg}${body}</svg>`;
}
function eye(cx,cy,scare,iris){
  if(scare){ // пустой эндоскелетный взгляд — белые точки во тьме
    return `<ellipse cx="${cx}" cy="${cy}" rx="15" ry="16" fill="#0a0a0c"/><circle cx="${cx}" cy="${cy}" r="4" fill="#fff"/>`;
  }
  return `<ellipse cx="${cx}" cy="${cy}" rx="13" ry="14" fill="#fff"/><circle cx="${cx}" cy="${cy+1}" r="6.5" fill="${iris||'#2a6fb0'}"/><circle cx="${cx}" cy="${cy+1}" r="3" fill="#0a0a0c"/>`;
}
function bigMouth(cx,cy,r,col,jagged){
  const teeth = jagged
    ? `<path d="M${cx-r} ${cy-r+4} l8 14 8 -14 8 14 8 -14 8 14 8 -14 8 14 8 -14" stroke="#efeae0" stroke-width="4" fill="none"/>
       <path d="M${cx-r} ${cy+r-4} l8 -14 8 14 8 -14 8 14 8 -14 8 14 8 -14 8 14" stroke="#efeae0" stroke-width="4" fill="none"/>`
    : (()=>{let t="";for(let i=-r;i<r;i+=11){t+=`<rect x="${cx+i}" y="${cy-r+2}" width="8" height="13" fill="#efeae0"/>`;t+=`<rect x="${cx+i+4}" y="${cy+r-15}" width="8" height="13" fill="#d8d2c4"/>`;}return t;})();
  return `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r+6}" fill="${col}"/>${teeth}`;
}

/* =========================================================================
   ЗВУК (Web Audio, всё синтезируется)
   ========================================================================= */
let AC=null, master=null, ambient=null, musicTimer=null;
function ensureAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted?0:0.5; master.connect(AC.destination);
  }catch(e){ AC=null; }
}
function noiseBuffer(dur){
  const n=Math.floor(AC.sampleRate*dur); const b=AC.createBuffer(1,n,AC.sampleRate); const d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b;
}
function tone(freq,dur,type,vol,slideTo){
  if(!AC)return; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, AC.currentTime+dur);
  g.gain.value=0; g.gain.linearRampToValueAtTime(vol||0.2, AC.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function noise(dur,vol,filterFreq,type){
  if(!AC)return; const s=AC.createBufferSource(); s.buffer=noiseBuffer(dur);
  const g=AC.createGain(); g.gain.value=vol||0.2;
  const f=AC.createBiquadFilter(); f.type=type||"bandpass"; f.frequency.value=filterFreq||1200;
  s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(AC.currentTime+dur);
}

function playMusicBox(){
  if(!AC)return; stopMusicBox();
  const mel=[523,659,784,659,523,587,659,494]; let i=0;

  step();

function stopMusicBox(){ if(musicTimer){clearTimeout(musicTimer);musicTimer=null;} }
function playChime(){
  if(!AC)return; [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.6,"sine",0.18),i*140));
  setTimeout(()=>{ noise(1.2,0.06,2000); },200); // лёгкий «гул толпы»
}
/* фоновый вентилятор */
function startAmbient(){
  if(!AC||ambient) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuffer(2); s.loop=true;
  const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=420;
  const g=AC.createGain(); g.gain.value=0.05;
  s.connect(f); f.connect(g); g.connect(master); s.start();
  ambient={s,g};
}
function stopAmbient(){ if(ambient){ try{ambient.s.stop();}catch(e){} ambient=null; } }

/* =========================================================================
   ВВОД / СОБЫТИЯ
   ========================================================================= */
function bind(){
  setIcons();
  // титул
  $("btnNew").onclick=()=>{ ensureAudio(); startNight(1); };
  // навигация
  $("btnRetry").onclick=()=>{ ensureAudio(); startNight(G.night); };
  $("btnOverMenu").onclick=toMenu;
  $("btnWinMenu").onclick=toMenu;
  $("btnNext").onclick=()=>{ if(G.night>=5) toMenu(); else startNight(G.night+1); };
  $("btnQuit").onclick=()=>{ if(loop)clearInterval(loop); stopAmbient(); stopMusicBox(); toMenu(); };
  $("btnMute").onclick=toggleMute;

  // двери/свет/камеры (мышь)
  $("btnDoorL").onclick=()=>toggleDoor("L");
  $("btnDoorR").onclick=()=>toggleDoor("R");
  $("btnLightL").onclick=()=>flickLight("L");
  $("btnLightR").onclick=()=>flickLight("R");
  $("camHandle").onclick=raiseCams;
  $("camDown").onclick=()=>lowerCams();

  // клавиатура
  window.addEventListener("keydown",e=>{
    if(!G||G.over||G.won||$("play").classList.contains("hidden")) return;
    switch(e.code){
      case "KeyA": flickLight("L"); break;
      case "KeyD": flickLight("R"); break;
      case "KeyQ": toggleDoor("L"); break;
      case "KeyE": toggleDoor("R"); break;
      case "Space": e.preventDefault(); G.camsUp?lowerCams():raiseCams(); break;
      case "Digit1": if(G.camsUp)selectCam("1A"); break;
      case "Digit2": if(G.camsUp)selectCam("1B"); break;
      case "Digit3": if(G.camsUp)selectCam("1C"); break;
    }
  });
  buildTitle();
}
function toMenu(){ if(loop){clearInterval(loop);loop=null;} stopAmbient(); stopMusicBox(); G=null; buildTitle(); show("title"); }
function toggleMute(){ muted=!muted; if(master) master.gain.value=muted?0:0.5;
  $("btnMute").innerHTML=(muted?ICONS.mute:ICONS.sound); $("btnMute").firstChild.id="icoMute"; }

function buildTitle(){
  // выбор ночи
  const box=$("nightSelect"); box.innerHTML="";
  for(let n=1;n<=5;n++){
    const c=document.createElement("button");
    c.className="nightchip"+(n<=unlocked?"":" locked")+(n===unlocked?" on":"");
    c.textContent=n;
    if(n<=unlocked) c.onclick=()=>{ ensureAudio(); startNight(n); };
    box.appendChild(c);
  }
  $("ctrlHint").innerHTML = "Дотяни смену с 12 до 6 утра. Свет коридора — кто пришёл, дверь — заслон, но всё это жрёт заряд.<br>"+
    "<b style='color:#8b97a6'>Клавиши:</b> A / D — свет · Q / E — двери · Пробел — камеры · 1–3 — быстрые камеры";
}

/* старт */
bind();
show("title");
